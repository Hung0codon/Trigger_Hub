apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: tf1-ai-triage-engine
  labels:
    app: tf1-ai-triage-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tf1-ai-triage-engine
  template:
    metadata:
      labels:
        app: tf1-ai-triage-engine
    spec:
      containers:
        - name: tf1-ai-triage-engine
          image: 589077667575.dkr.ecr.us-east-1.amazonaws.com/tf1-ai-triage-engine:v1.0.0
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          env:
            - name: APP_ENV
              value: "sandbox"
            - name: SERVICE_AUTH_TOKEN
              value: "mock-token-secret"
            - name: AIOPS_INVESTIGATION_MODE
              value: "auto"
            - name: AIOPS_TRIAGE_DEADLINE_SECONDS
              value: "30"
            - name: AIOPS_RATE_LIMIT_PER_MINUTE
              value: "60"
            - name: AIOPS_MAX_REQUEST_BYTES
              value: "524288"
            - name: AIOPS_MAX_CONCURRENT_TRIAGE_REQUESTS
              value: "0"
            - name: PROMETHEUS_URL
              value: "http://prometheus-k8s.tf1-monitoring.svc.cluster.local:9090"
            - name: LOKI_URL
              value: "http://loki.tf1-monitoring.svc.cluster.local:3100"
            - name: JAEGER_URL
              value: "http://jaeger-collector.tf1-monitoring.svc.cluster.local:14268"
            - name: EVIDENCE_BUNDLE_BASE_PATH
              value: "/tmp/evidence"
            - name: AIOPS_AUDIT_LOG_PATH
              value: "audit/audit-log.jsonl"
            - name: AIOPS_AUDIT_RETENTION_DAYS
              value: "90"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
  strategy:
    canary:
      analysis:
        templates:
          - templateName: tf1-ai-engine-success-rate
        args:
          - name: service-name
            value: tf1-ai-triage-engine
      steps:
        - setWeight: 10
        - pause: {} # Pause indefinitely until manually approved (SRE Promotion Gate)
        - setWeight: 30
        - pause: { duration: 10m }
        - setWeight: 60
        - pause: { duration: 10m }

