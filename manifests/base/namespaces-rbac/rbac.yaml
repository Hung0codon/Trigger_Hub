apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tf1-developer-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tf1-dev-readonly-binding
  namespace: tf1-platform
subjects:
  - kind: Group
    name: "tf1-developers" # Maps to IAM/OIDC Developer Group
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: tf1-developer-readonly
  apiGroup: rbac.authorization.k8s.io
