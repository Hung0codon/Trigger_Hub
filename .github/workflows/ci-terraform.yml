name: "Terraform GitOps Pipeline"

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "infra/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "infra/**"

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read
  pull-requests: write # Required to post plan output as a comment

jobs:
  validate:
    name: "1. Lint & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./infra

      - name: Terraform Init
        run: |
          cd environments/sandbox
          terraform init -backend=false
        working-directory: ./infra

      - name: Terraform Validate
        run: |
          cd environments/sandbox
          terraform validate
        working-directory: ./infra

  plan:
    name: "2. Terraform Plan"
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [sandbox] # Expandable to [sandbox, staging, prod]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945125812908:role/tf1-cdo05-github-actions-role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra/environments/${{ matrix.environment }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ./infra/environments/${{ matrix.environment }}

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = `#### Env: \`${{ matrix.environment }}\`
            #### Terraform Format and Style 🖌 \`Success\`
            #### Terraform Initialization ⚙️ \`Success\`
            #### Terraform Plan 📖 \`Success\`
            
            <details><summary>Show Plan Output</summary>
            
            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          PLAN: "tfplan" # In practice, read plan output using terraform show

  apply:
    name: "3. Terraform Apply"
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [sandbox] # Automatically maps branch to environment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945125812908:role/tf1-cdo05-github-actions-role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra/environments/${{ matrix.environment }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./infra/environments/${{ matrix.environment }}
